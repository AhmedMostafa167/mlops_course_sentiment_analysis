seed: 2020

data:
  data_dir: data          # relative to the project root
  val_size: 0.1

preprocessing:
  remove_emojis: true     # must match between training and serving

model:
  version: mini           # key into MODEL_NAMES: mini | base
  max_length: 128         # in tokens, not characters
  hidden_dim: 50          # classifier head hidden layer
  dropout: 0.5
  freeze_bert: false

training:
  batch_size: 16
  epochs: 2
  learning_rate: 5.0e-5
  adam_eps: 1.0e-8
  warmup_steps: 0
  max_grad_norm: 1.0
  log_every: 20           # batches between progress logs
  device: auto            # auto | cpu | cuda

evaluation:
  threshold: 0.5          # P(positive) >= threshold -> label 1

artifacts:
  output_dir: models      # relative to the project root

logging:
  level: INFO

mlflow:
  tracking_uri: "sqlite:///mlflow.db"
  experiment_name: "arabic-sentiment-bert"
  registered_model_name: "arabic_sentiment_champion"
