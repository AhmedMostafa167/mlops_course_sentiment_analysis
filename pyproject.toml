[project]
name = "mlops-practitioner-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bentoml>=1.4",
    "dvc>=3.67.1",
    "emoji>=2.16.0",
    "fastapi[standard]>=0.142.2",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
    "transformers>=5.18.0",
]

[project.scripts]
mlops-practitioner-course = "mlops_practitioner_course.main:main"

[build-system]
requires = ["uv_build>=0.10.7,<0.11"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
